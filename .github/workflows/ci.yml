name: CI

on:
  push:
    branches: [app-v2, main]
  pull_request:
    branches: [app-v2, main]

jobs:
  whatsapp-gateway-tests:
    name: WhatsApp gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: services/whatsapp-gateway
        run: npm ci

      - name: Run tests
        working-directory: services/whatsapp-gateway
        run: npm test

  frontend-js-syntax:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check assets/js/*.js
        run: |
          set -e
          for f in assets/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Check inline <script> blocks in HTML pages
        run: node .github/scripts/check-inline-js.js

  deno-check:
    name: Deno type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check each edge function
        run: |
          set -e
          for dir in supabase/functions/*/; do
            if [ -f "${dir}index.ts" ]; then
              echo "Checking ${dir}index.ts"
              (cd "$dir" && deno check index.ts)
            fi
          done
