<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <!-- Report-Only this sprint: see docs/security.md for rationale and upgrade path. -->
    <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://hanbgkefeqgstnsaapel.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Administration | Mirador Golf 1
    </title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://hanbgkefeqgstnsaapel.supabase.co">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <link
        rel="stylesheet"
        href="assets/css/app.css"
    >

    <style>

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(179, 146, 85, 0.10),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    var(--mirador-green-950),
                    var(--mirador-green-800)
                );
        }

        .admin-login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 18px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 450px;

            background: var(--mirador-surface);

            border-radius: var(--mirador-radius-xl);

            padding: 38px;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.25);
        }

        .admin-logo {
            width: 60px;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 25px;

            border-radius: var(--mirador-radius-lg);

            background: var(--mirador-primary);

            color: white;

            font-weight: 900;
            font-size: 20px;
        }

        .admin-label {
            margin: 0 0 5px;

            color: var(--mirador-gold-ink);

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            color: var(--mirador-green-950);

            font-size: 30px;
        }

        .description {
            margin:
                10px
                0
                28px;

            color: var(--mirador-text-muted);

            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: var(--mirador-ink-700);

            font-size: 14px;
            font-weight: 650;
        }

        .login-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--mirador-space-2);

            width: 100%;

            min-height: 52px;

            margin-top: 7px;

            font-size: 15px;
        }

        #loginMessage {
            min-height: 22px;

            margin:
                17px
                0
                0;

            text-align: center;

            font-size: 13px;
            font-weight: 600;
        }

        .error {
            color: var(--mirador-danger);
        }

        .success {
            color: var(--mirador-success);
        }

        .security {
            margin-top: 25px;

            padding-top: 18px;

            border-top:
                1px solid var(--mirador-border);

            color: var(--mirador-text-muted);

            text-align: center;

            font-size: 12px;
        }

        .back-link {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--mirador-ink-700);

            font-size: 13px;
        }

        .back-link:hover {
            color: var(--mirador-primary);
        }

        @media (max-width: 480px) {
            .admin-login-card {
                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>


<main class="admin-login-page">


    <section class="admin-login-card">


        <div class="admin-logo">
            MG
        </div>


        <p class="admin-label">
            MIRADOR GOLF 1
        </p>


        <h1>
            Administration
        </h1>


        <p class="description">
            Connectez-vous avec votre compte administrateur
            pour accéder à la gestion de la résidence.
        </p>


        <form id="adminLoginForm">


            <div class="field mirador-field">

                <label class="mirador-label" for="email">
                    Adresse email
                </label>

                <input
                    id="email"
                    class="mirador-input"
                    type="email"
                    autocomplete="email"
                    aria-required="true"
                    required
                >

            </div>


            <div class="field mirador-field">

                <label class="mirador-label" for="password">
                    Mot de passe
                </label>

                <input
                    id="password"
                    class="mirador-input"
                    type="password"
                    autocomplete="current-password"
                    aria-required="true"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="login-submit mirador-btn"
                type="submit"
            >
                <span
                    id="loginSpinner"
                    class="mirador-spinner"
                    hidden
                    aria-hidden="true"
                ></span>
                <span id="loginButtonLabel">Se connecter</span>
            </button>


            <p
                id="loginMessage"
                aria-live="polite"
            ></p>


        </form>


        <div class="security">
            <span aria-hidden="true">🔒</span> Accès réservé aux administrateurs autorisés
        </div>


        <a
            class="back-link"
            href="index.html"
        >
            ← Retour à Mirador Golf 1
        </a>


    </section>


</main>


<script src="assets/js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-client.js"></script>


<script>

const form =
    document.getElementById(
        "adminLoginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginButtonLabel =
    document.getElementById(
        "loginButtonLabel"
    );

const loginSpinner =
    document.getElementById(
        "loginSpinner"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

// Maps known, expected auth outcomes to a safe French message. Anything
// not in this list (network errors, rate limiting, unexpected Supabase
// error text, etc.) falls back to a single generic message instead of
// leaking internal error details to the user.
const KNOWN_LOGIN_ERRORS = {
    "Invalid login credentials":
        "Email ou mot de passe incorrect.",
    "Email not confirmed":
        "Ce compte n'a pas encore été confirmé.",
};

const GENERIC_LOGIN_ERROR =
    "Connexion impossible pour le moment. Veuillez réessayer.";

function safeLoginErrorMessage(error) {
    if (error && error.miradorSafeMessage) {
        return error.message;
    }

    if (
        error &&
        typeof error.message === "string" &&
        Object.prototype.hasOwnProperty.call(
            KNOWN_LOGIN_ERRORS,
            error.message
        )
    ) {
        return KNOWN_LOGIN_ERRORS[error.message];
    }

    return GENERIC_LOGIN_ERROR;
}

function setLoginLoading(isLoading) {
    loginButton.disabled = isLoading;
    loginSpinner.hidden = !isLoading;
    loginButtonLabel.textContent =
        isLoading ? "Connexion..." : "Se connecter";
}


async function redirectIfAlreadyAdmin() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {
        return;
    }


    const {
        data: admin
    } =
        await supabaseClient
            .from("admin_users")
            .select(
                "id, role, is_active"
            )
            .eq(
                "auth_user_id",
                session.user.id
            )
            .maybeSingle();


    if (
        admin &&
        admin.is_active
    ) {

        window.location.href =
            "admin.html";

    }

}


redirectIfAlreadyAdmin();



form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        loginMessage.textContent =
            "";

        loginMessage.className =
            "";


        setLoginLoading(true);


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        try {


            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Utilisateur introuvable."
                );

            }


            const {
                data: admin,
                error: adminError
            } =
                await supabaseClient
                    .from("admin_users")
                    .select(
                        `
                        id,
                        display_name,
                        role,
                        is_active
                        `
                    )
                    .eq(
                        "auth_user_id",
                        data.user.id
                    )
                    .maybeSingle();


            if (
                adminError ||
                !admin ||
                !admin.is_active
            ) {

                await supabaseClient
                    .auth
                    .signOut();


                const unauthorizedError =
                    new Error(
                        "Ce compte n'est pas autorisé à accéder à l'administration."
                    );

                unauthorizedError.miradorSafeMessage =
                    true;

                throw unauthorizedError;

            }


            loginMessage.textContent =
                "Connexion réussie.";

            loginMessage.className =
                "success";


            window.location.href =
                "admin.html";


        }

        catch (error) {


            console.error(
                "Admin login error:",
                error
            );


            loginMessage.textContent =
                safeLoginErrorMessage(error);


            loginMessage.className =
                "error";


            setLoginLoading(false);


        }

    }
);

</script>


</body>

</html>
