<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Mon espace | Mirador Golf 1
    </title>

    <link
        rel="stylesheet"
        href="assets/css/app.css"
    >

    <style>

        body {
            margin: 0;
            background: #f4f7f5;
        }


        .owner-header {
            background: #0b2f27;
            color: white;
        }


        .owner-header-content {
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .owner-brand {
            display: flex;
            align-items: center;

            gap: 12px;
        }


        .owner-logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: white;
            color: #174b3d;

            font-weight: 900;
        }


        .owner-brand strong {
            display: block;
        }


        .owner-brand span {
            display: block;

            margin-top: 1px;

            color:
                rgba(255,255,255,0.55);

            font-size: 11px;
        }


        .logout {
            padding: 9px 14px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 9px;

            background:
                rgba(255,255,255,0.07);

            color: white;

            cursor: pointer;
        }


        .owner-main {
            padding:
                45px
                0
                80px;
        }


        .owner-welcome {
            padding: 32px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #103d32,
                    #23634f
                );

            color: white;
        }


        .owner-welcome span {
            color: #a8d5c3;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }


        .owner-welcome h1 {
            margin:
                8px
                0
                5px;

            color: white;

            font-size: 32px;
        }


        .owner-welcome p {
            margin: 0;

            color:
                rgba(255,255,255,0.65);
        }


        .owner-info {
            margin-top: 25px;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }


        .info-card {
            padding: 22px;

            border:
                1px solid #e1e8e5;

            border-radius: 15px;

            background: white;
        }


        .info-card span {
            display: block;

            margin-bottom: 5px;

            color: #71847c;

            font-size: 11px;
        }


        .info-card strong {
            color: #143d32;

            font-size: 18px;
        }


        .coming {
            margin-top: 25px;

            padding: 30px;

            border:
                1px dashed #cddbd5;

            border-radius: 15px;

            background: white;

            color: #63766e;

            text-align: center;
        }


        @media (
            max-width: 600px
        ) {

            .owner-info {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<header class="owner-header">

    <div class="container owner-header-content">


        <div class="owner-brand">

            <div class="owner-logo">
                MG
            </div>

            <div>

                <strong>
                    Mirador Golf 1
                </strong>

                <span>
                    Espace propriétaire
                </span>

            </div>

        </div>


        <button
            id="logoutButton"
            class="logout"
            type="button"
        >
            Déconnexion
        </button>


    </div>

</header>



<main class="owner-main">


    <div class="container">


        <section class="owner-welcome">


            <span>
                MON ESPACE
            </span>


            <h1 id="ownerName">
                Chargement...
            </h1>


            <p id="ownerResidence">
                Mirador Golf 1
            </p>


        </section>



        <section class="owner-info">


            <article class="info-card">

                <span>
                    BLOC
                </span>

                <strong id="ownerBuilding">
                    —
                </strong>

            </article>


            <article class="info-card">

                <span>
                    APPARTEMENT
                </span>

                <strong id="ownerApartment">
                    —
                </strong>

            </article>


        </section>



        <section class="coming">

            ✅ Votre compte propriétaire est actif.

            <br><br>

            Les modules Réunions, Votes, Syndic,
            Annonces et Documents seront ajoutés
            progressivement.

        </section>


    </div>


</main>



<script src="assets/js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-client.js"></script>


<script>


async function loadOwner() {


    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        !session
    ) {

        window.location.href =
            "connexion.html";

        return;

    }


    const {
        data: owner,
        error: ownerError
    } =
        await supabaseClient
            .from(
                "owner_accounts"
            )
            .select(
                `
                id,
                first_name,
                last_name,
                phone,
                status
                `
            )
            .eq(
                "auth_user_id",
                session.user.id
            )
            .maybeSingle();


    if (
        ownerError ||
        !owner ||
        owner.status !== "active"
    ) {

        await supabaseClient
            .auth
            .signOut();


        window.location.href =
            "connexion.html";

        return;

    }


    const {
        data: units,
        error: unitsError
    } =
        await supabaseClient
            .from(
                "owner_account_units"
            )
            .select(
                `
                building_code,
                apartment_number,
                is_primary
                `
            )
            .eq(
                "owner_account_id",
                owner.id
            )
            .order(
                "is_primary",
                {
                    ascending:
                        false
                }
            );


    if (
        unitsError
    ) {

        console.error(
            unitsError
        );

    }


    const primaryUnit =
        units?.[0] || null;


    document
        .getElementById(
            "ownerName"
        )
        .textContent =
            `Bonjour ${owner.first_name} ${owner.last_name}`;


    document
        .getElementById(
            "ownerBuilding"
        )
        .textContent =
            primaryUnit?.building_code ||
            "—";


    document
        .getElementById(
            "ownerApartment"
        )
        .textContent =
            primaryUnit?.apartment_number ||
            "—";


}



document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async () => {


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "connexion.html";


        }
    );



loadOwner();


</script>


</body>

</html>
